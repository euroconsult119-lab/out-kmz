<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KML & KMZ Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 1. Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. مكتبة KMZ -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <!-- 3. مكتبة Omnivore الأحدث -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        // إعداد الخريطة والمركز الافتراضي (مكة المكرمة)
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        // طبقة الأقمار الصناعية (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // قراءة اسم الملف من الرابط
        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            var fileUrl = "https://euroconsult119-lab.github.io/out-kmz/" + fileName;
            var lowerFileName = fileName.toLowerCase();

            // ==========================================
            // التعامل مع ملفات KML عبر Omnivore + GeoJSON
            // ==========================================
            if (lowerFileName.endsWith('.kml')) {
                // إنشاء طبقة GeoJSON مخصصة بستايل واضح (لون أحمر للخطوط والمضلعات)
                var customLayer = L.geoJson(null, {
                    style: function (feature) {
                        return { color: '#ff0000', weight: 3, opacity: 0.9, fillOpacity: 0.3 };
                    },
                    pointToLayer: function (feature, latlng) {
                        // في حال كان الملف يحتوي على نقاط، رسمها كعلامات واضحة
                        return L.marker(latlng);
                    }
                });

                // تحميل الـ KML وتحويله وضخه في الطبقة المخصصة
                var kmlLayer = omnivore.kml(fileUrl, null, customLayer)
                    .on('ready', function() {
                        var bounds = this.getBounds();
                        if (bounds && bounds.isValid()) {
                            map.fitBounds(bounds);
                        } else {
                            alert('تم قراءة الملف ولكن لا توجد إحداثيات صالحة للرسم بداخله.');
                        }
                    })
                    .on('error', function(e) {
                        console.error('Omnivore Error:', e);
                        alert('حدث خطأ أثناء تحميل ملف KML. تحقق من Console (F12) لمعرفة التفاصيل.');
                    })
                    .addTo(map);
            } 
            // ==========================================
            // التعامل مع ملفات KMZ
            // ==========================================
            else if (lowerFileName.endsWith('.kmz')) {
                var kmzLayer = L.kmzLayer().addTo(map);
                
                kmzLayer.on('load', function(e) {
                    var bounds = e.layer.getBounds();
                    if (bounds && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                });

                kmzLayer.on('error', function(e) {
                    console.error('KMZ Error:', e);
                    alert('حدث خطأ أثناء تحميل ملف KMZ.');
                });
                
                kmzLayer.load(fileUrl);
            } 
            else {
                alert('صيغة الملف غير مدعومة! يرجى استخدام ملف .kml أو .kmz');
            }
        }
    </script>
</body>
</html>
