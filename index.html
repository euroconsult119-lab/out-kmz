<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KML & KMZ Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 1. Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Leaflet-KMZ (للمعادلة القديمة الناجحة) -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <!-- 3. Omnivore + JSZip (للمعالجة التلقائية للملفات الجديدة) -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            var fileUrl = "https://euroconsult119-lab.github.io/out-kmz/" + fileName;
            var lowerFileName = fileName.toLowerCase();

            // =========================================================
            // دالة رسم الملفات الجديدة مع ضمان الزووم التلقائي 100%
            // =========================================================
            function renderFixedKML(kmlText) {
                var fixedKmlText = kmlText
                    .replace(/<LinearRing>/g, '<Polygon><outerBoundaryIs><LinearRing>')
                    .replace(/<\/LinearRing>/g, '</LinearRing></outerBoundaryIs></Polygon>');

                var customLayer = L.geoJson(null, {
                    style: function () {
                        return { color: '#0055ff', weight: 3, opacity: 1, fillOpacity: 0.3 };
                    }
                });

                // دالة تنفيذ الزووم المضمونة
                function doZoom() {
                    var bounds = customLayer.getBounds();
                    if (bounds && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                }

                // 1. محاولة الزووم بمجرد إضافة أي عنصر للطبقة
                customLayer.on('layeradd', function() {
                    doZoom();
                });

                // 2. محاولة الزووم بعد اكتمال قراءة الملف بالكامل (بعد 300 مللي ثانية لضمان الرسم)
                var kmlLayer = omnivore.kml.parse(fixedKmlText, null, customLayer)
                    .on('ready', function() {
                        setTimeout(doZoom, 300);
                    })
                    .addTo(map);
            }

            // =========================================================
            // 1. التعامل مع ملفات KMZ (معادلتك القديمة أولاً دائماً)
            // =========================================================
            if (lowerFileName.endsWith('.kmz')) {
                var kmz = L.kmzLayer().addTo(map);
                
                kmz.on('load', function(e) {
                    var bounds = e.layer.getBounds();
                    // لو الملف سليم (زي القديم) هيعمل زوم ويقف هنا
                    if (bounds && bounds.isValid() && Object.keys(e.layer._layers).length > 0) {
                        map.fitBounds(bounds);
                    } else {
                        // لو الملف ظهر فاضي، نصلحه ونرسمه مع الزووم المضمون
                        fixAndLoadKMZ(fileUrl);
                    }
                });

                kmz.on('error', function() {
                    fixAndLoadKMZ(fileUrl);
                });
                
                kmz.load(fileUrl);

                function fixAndLoadKMZ(url) {
                    fetch(url)
                        .then(res => res.arrayBuffer())
                        .then(buffer => JSZip.loadAsync(buffer))
                        .then(zip => {
                            var kmlFilename = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
                            if (kmlFilename) {
                                return zip.files[kmlFilename].async("string");
                            }
                        })
                        .then(kmlText => {
                            if (kmlText) renderFixedKML(kmlText);
                        });
                }
            }
            // =========================================================
            // 2. التعامل مع ملفات KML مباشرة
            // =========================================================
            else if (lowerFileName.endsWith('.kml')) {
                fetch(fileUrl)
                    .then(res => res.text())
                    .then(kmlText => renderFixedKML(kmlText))
                    .catch(err => alert("خطأ في تحميل ملف KML: " + err.message));
            } 
            else {
                alert("صيغة الملف غير مدعومة! يرجى استخدام .kml أو .kmz");
            }
        }
    </script>
</body>
</html>
