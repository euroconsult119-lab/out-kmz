<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KML & KMZ Viewer (Free)</title>
    
    <!-- استدعاء ملفات التنسيق لمكتبة Leaflet المجانية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- استدعاء مكتبة Leaflet الأساسية -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- استدعاء مكتبة قراءة ملفات KMZ و KML -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <script>
        // 1. إعداد الخريطة والمركز الافتراضي (مكة المكرمة)
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        // 2. إضافة طبقة الأقمار الصناعية المجانية (Esri World Imagery) - لا تحتاج API Key
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 3. قراءة اسم الملف من متغيرات الرابط
        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            // تجميع الرابط الكامل للملف (يدعم KML و KMZ)
            var fileUrl = "https://euroconsult119-lab.github.io/out-kmz/" + fileName;

            // 4. إعداد طبقة العرض (تدعم كلاً من KML و KMZ تلقائياً)
            var geoLayer = L.kmzLayer().addTo(map);
            
            geoLayer.on('load', function(e) {
                var bounds = e.layer.getBounds();
                if (bounds && bounds.isValid()) {
                    // عمل Zoom تلقائي على حدود المشروع بمجرد تحميله
                    map.fitBounds(bounds);
                }
            });

            // إضافة تنبيه في حال حدوث خطأ في تحميل الملف
            geoLayer.on('error', function(e) {
                console.error('حدث خطأ أثناء تحميل الملف:', e);
            });
            
            // تنفيذ التحميل (سواء كان الملف .kml أو .kmz)
            geoLayer.load(fileUrl);
        }
    </script>
</body>
</html>
