<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KML & KMZ Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 1. Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Leaflet-KMZ (للملفات القديمة) -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <!-- 3. Omnivore (لقراءة الـ KML) -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <!-- 4. JSZip (لفك ضغط KMZ وتصحيح الكود الداخلي للملفات الجديدة) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            var fileUrl = "https://euroconsult119-lab.github.io/out-kmz/" + fileName;
            var lowerFileName = fileName.toLowerCase();

            // دالة تصحيح ورسم نص الـ KML (بتعالج مشكلة LinearRing اليتيم)
            function parseAndRenderKML(kmlText) {
                var fixedKmlText = kmlText
                    .replace(/<LinearRing>/g, '<Polygon><outerBoundaryIs><LinearRing>')
                    .replace(/<\/LinearRing>/g, '</LinearRing></outerBoundaryIs></Polygon>');

                var customLayer = L.geoJson(null, {
                    style: function () {
                        return { color: '#0055ff', weight: 3, opacity: 1, fillOpacity: 0.3 };
                    }
                });

                var layer = omnivore.kml.parse(fixedKmlText, null, customLayer)
                    .on('ready', function() {
                        var bounds = this.getBounds();
                        if (bounds && bounds.isValid()) {
                            map.fitBounds(bounds);
                        } else {
                            alert("تم قراءة الملف ولكن لا توجد إحداثيات صالحة للرسم.");
                        }
                    })
                    .addTo(map);
            }

            // ==========================================
            // 1. التعامل مع ملفات KML مباشرة
            // ==========================================
            if (lowerFileName.endsWith('.kml')) {
                fetch(fileUrl)
                    .then(res => {
                        if (!res.ok) throw new Error("الملف غير موجود");
                        return res.text();
                    })
                    .then(text => parseAndRenderKML(text))
                    .catch(err => alert("خطأ في تحميل ملف KML: " + err.message));
            }
            // ==========================================
            // 2. التعامل مع ملفات KMZ (القديمة + الجديدة)
            // ==========================================
            else if (lowerFileName.endsWith('.kmz')) {
                // بنحمل الملف كـ Binary علشان نفكه ونصلحه لو مكتبة kmz العادية فشلت في رسمه
                fetch(fileUrl)
                    .then(res => {
                        if (!res.ok) throw new Error("الملف غير موجود على السيرفر");
                        return res.arrayBuffer();
                    })
                    .then(buffer => JSZip.loadAsync(buffer))
                    .then(zip => {
                        // البحث عن أول ملف امتداده .kml داخل الـ zip (مثل doc.kml أو غيره)
                        var kmlFilename = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
                        if (!kmlFilename) {
                            throw new Error("ملف KMZ لا يحتوي على ملف KML داخله");
                        }
                        return zip.files[kmlFilename].async("string");
                    })
                    .then(kmlText => {
                        // تمرير النص للدالة الذكية لتصحيحه ورسمه
                        parseAndRenderKML(kmlText);
                    })
                    .catch(err => {
                        console.error("JSZip failed, falling back to L.kmzLayer:", err);
                        // خيار احتياطي للملفات القديمة جداً
                        var kmzLayer = L.kmzLayer().addTo(map);
                        kmzLayer.on('load', function(e) {
                            var bounds = e.layer.getBounds();
                            if (bounds && bounds.isValid()) map.fitBounds(bounds);
                        });
                        kmzLayer.load(fileUrl);
                    });
            } 
            else {
                alert("صيغة الملف غير مدعومة! يرجى استخدام .kml أو .kmz");
            }
        }
    </script>
</body>
</html>
