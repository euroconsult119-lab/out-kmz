<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KML & KMZ Viewer</title>
    
    <!-- استدعاء ملفات التنسيق لمكتبة Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 1. مكتبة Leaflet الأساسية -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. مكتبة قراءة ملفات KMZ -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <!-- 3. مكتبة leaflet-kml الحديثة والمباشرة لقراءة ملفات KML -->
    <script src="https://unpkg.com/leaflet-kml@1.0.0/L.KML.js"></script>

    <script>
        // إعداد الخريطة والمركز الافتراضي
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        // إضافة طبقة الأقمار الصناعية (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // قراءة اسم الملف من الرابط
        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            var fileUrl = "https://euroconsult119-lab.github.io/out-kmz/" + fileName;
            var lowerFileName = fileName.toLowerCase();

            // ==========================================
            // الحالة الأولى: ملفات KML (باستخدام Fetch و L.KML)
            // ==========================================
            if (lowerFileName.endsWith('.kml')) {
                fetch(fileUrl)
                    .then(res => {
                        if (!res.ok) throw new Error('تعذر الوصول للملف (تأكد من اسم الملف أو رفعه على GitHub)');
                        return res.text();
                    })
                    .then(kmlText => {
                        // تحويل النص إلى كائن XML
                        var parser = new DOMParser();
                        var kmlxml = parser.parseFromString(kmlText, 'text/xml');
                        
                        // إضافة طبقة KML للخريطة
                        var track = new L.KML(kmlxml);
                        map.addLayer(track);
                        
                        // ضبط الزووم تلقائياً على حدود الملف
                        var bounds = track.getBounds();
                        if (bounds && bounds.isValid()) {
                            map.fitBounds(bounds);
                        }
                    })
                    .catch(err => {
                        console.error('خطأ في تحميل KML:', err);
                        alert('حدث خطأ أثناء قراءة ملف KML: ' + err.message);
                    });
            } 
            // ==========================================
            // الحالة الثانية: ملفات KMZ
            // ==========================================
            else if (lowerFileName.endsWith('.kmz')) {
                var kmzLayer = L.kmzLayer().addTo(map);
                
                kmzLayer.on('load', function(e) {
                    var bounds = e.layer.getBounds();
                    if (bounds && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                });

                kmzLayer.on('error', function(e) {
                    console.error('خطأ في تحميل KMZ:', e);
                    alert('تعذر تحميل ملف KMZ.');
                });
                
                kmzLayer.load(fileUrl);
            } 
            else {
                alert('صيغة الملف غير مدعومة! يرجى استخدام ملف .kml أو .kmz');
            }
        }
    </script>
</body>
</html>
